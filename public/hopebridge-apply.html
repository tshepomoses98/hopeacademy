<!DOCTYPE html>
<html>
  <body>
    <!-- Static form skeleton for Netlify build-time form detection. Never shown to users. -->
    <form name="hopebridge-apply" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="fullName" />
      <input type="tel" name="phone" />
      <input type="email" name="email" />
      <select name="service">
        <option>University Applications</option>
        <option>Bursary Applications</option>
        <option>GDE School Applications</option>
        <option>ID / Birth Certificate</option>
        <option>SRD R350 Grant</option>
        <option>Child Support Grant</option>
        <option>Online Tutoring</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
